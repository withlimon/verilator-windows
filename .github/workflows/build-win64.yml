# Copyright Limon DAS 
name: Build Verilator for Windows 64bit

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_verilator_win64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: build
        run: bash build.sh

      - name: Check if release already exists
        id: check
        run: |
          TAG="v${{ steps.build.outputs.VERSION }}"
          
          # Check if release exists cleanly
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            EXISTS="yes"
          else
            EXISTS="no"
          fi
          
          # Safely write 'exists' using a heredoc delimiter
          echo "exists<<EOF" >> $GITHUB_OUTPUT
          echo "$EXISTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Safely write 'tag' using a heredoc delimiter
          echo "tag<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload
        if: steps.check.outputs.exists == 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: Verilator ${{ steps.build.outputs.VERSION }} Windows 64bit
          files: ${{ steps.build.outputs.TARBALL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Already up to date
        if: steps.check.outputs.exists == 'yes'
        run: echo "Release ${{ steps.check.outputs.tag }} already exists, skipping."
